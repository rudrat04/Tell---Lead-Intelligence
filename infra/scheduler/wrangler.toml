name = "tell-scheduler"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/30 * * * *", "0 2 * * *", "15 22 * * 6"]

[vars]
GH_REPO = "rudrat04/Tell---Lead-Intelligence"

# One-tap labels: taps wait here until the daily sync collects them.
# Create it once (npx wrangler kv namespace create LABELS) and paste the id it prints.
[[kv_namespaces]]
binding = "LABELS"
id = "1f0f20c8bd1f4c348c8953b3464a4e5e"
