name: Daily chain

# One chain instead of separate crons that must line up (plan v3 section 14 "Daily").
# migrations -> pack check -> partitions -> JSearch -> job-board diff -> tick (fallback) -> scoring + digest (once per IST day).
# Starts 07:30 IST so the digest lands before 09:00 even when GitHub delays scheduled runs.
# Public repo: every script prints counts only.
on:
  # Triggered daily at 07:30 IST by the Cloudflare scheduler Worker (infra/scheduler).
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # private config pack in R2; falls back to packs/example-gtm when TELL_PACK_R2_PREFIX is unset
      TELL_PACK_R2_PREFIX: ${{ vars.TELL_PACK_R2_PREFIX }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Partitions (this month + 2 ahead)
        run: pnpm exec tsx scripts/ensure-partitions.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Config pack
        run: pnpm pack:check

      # funding news first: freshly funded companies become accounts before scoring
      - name: Funding news (freshly funded companies)
        continue-on-error: true
        run: pnpm funding
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
      # niche public records (pack sources.niche): FDA shortages, ANDA approvals, 510(k) clearances, federal contracts
      # (ending and newly won), Medicare certifications, SEC Form D by industry, city permits and FMCSA carriers (Socrata).
      # Only Form D needs SEC_USER_AGENT; OPENFDA_API_KEY and SOCRATA_APP_TOKEN just raise rate limits.
      - name: Niche public records
        continue-on-error: true
        timeout-minutes: 40
        run: pnpm niche
        env:
          # after 25 minutes, names still to look up go to niche_queue (drained by every tick) so the digest and
          # opportunity leads keep their time; the step timeout is the backstop
          NICHE_MAX_MINUTES: "25"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # segment "auto" records (SME IPO, SBIR, PLI) get their industry from Haiku; without the key they get none
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAIKU_DAILY_CAP_USD: ${{ vars.HAIKU_DAILY_CAP_USD || '0.06' }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          BRANDFETCH_SEARCH_API: ${{ secrets.BRANDFETCH_SEARCH_API }}
          BRANDFETCH_BRAND_API: ${{ secrets.BRANDFETCH_BRAND_API }}
          DIFFBOT_TOKEN: ${{ secrets.DIFFBOT_TOKEN }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          SOCRATA_APP_SECRET: ${{ secrets.SOCRATA_APP_SECRET }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      # JSearch (Google for Jobs: LinkedIn/Naukri/Indeed listings) before the diff, so boards it finds get today's baseline
      - name: JSearch roles
        continue-on-error: true
        run: pnpm jsearch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Tell's own OpenWeb Ninja key only: the RapidAPI key is shared with another project, and the pack's
          # 190/month would use up its quota (no secret = the step skips)
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}

      # a rotating slice of discovery every day (Workable query x location, Common Crawl tenants), so the set of
      # companies keeps growing between the weekly runs; never blocks the digest
      - name: Discover new companies (daily slice)
        continue-on-error: true
        timeout-minutes: 15
        run: pnpm boards:discover --daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Job boards diff
        id: boards
        continue-on-error: true # a board outage must not stop scoring/digest; the digest reports it
        run: pnpm boards:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Fallback only: runs the tick here if no tick has run in the last 2 hours (scheduler down),
      # so it never overlaps a regular tick and double-spends Haiku.
      - name: Tick (fallback, only if stale)
        continue-on-error: true
        run: pnpm tick --if-stale-minutes 120
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          HAIKU_DAILY_CAP_USD: ${{ vars.HAIKU_DAILY_CAP_USD || '0.06' }}

      # Your labels from the Sheet (and any rows a failed append left behind) before today's scoring
      - name: Sheet sync
        continue-on-error: true
        run: pnpm sheet:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELL_LABEL_URL: ${{ vars.TELL_LABEL_URL }}
          LABEL_SECRET: ${{ secrets.LABEL_SECRET }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      # Find-email clicks left over (the Worker dispatches enrich.yml at once; this catches any it missed)
      - name: Find-email clicks
        continue-on-error: true
        run: pnpm enrich:requests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Tell's email waterfall (finders first, verifiers only for unsure addresses)
          QUICKEMAILVERIFICATION_API_KEY: ${{ secrets.QUICKEMAILVERIFICATION_API_KEY }}
          INBOXTRUE_API_KEY: ${{ secrets.INBOXTRUE_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRANDFETCH_SEARCH_API: ${{ secrets.BRANDFETCH_SEARCH_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELL_LABEL_URL: ${{ vars.TELL_LABEL_URL }}
          LABEL_SECRET: ${{ secrets.LABEL_SECRET }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      # Hard bounces in the sending mailbox mark those addresses invalid before today's digest (needs gmail.readonly).
      - name: Read bounces
        continue-on-error: true
        run: pnpm bounces
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      # The old path: leads are the companies that HAVE the signal. Off: leads are opportunity leads only (next step).
      # Set the repo variable LEGACY_LEADS=on to bring it back.
      - name: Score accounts and send digest
        id: digest
        if: vars.LEGACY_LEADS == 'on'
        continue-on-error: true
        run: pnpm digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # live "news" examples for a play's changes (market-lookups, pack sources.niche.market_news_per_day)
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          HAIKU_DAILY_CAP_USD: ${{ vars.HAIKU_DAILY_CAP_USD || '0.06' }}
          WRITER_DAILY_CAP_USD: ${{ vars.WRITER_DAILY_CAP_USD || '0.08' }}
          ANALYST_EFFORT: ${{ vars.ANALYST_EFFORT || 'low' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          DIFFBOT_TOKEN: ${{ secrets.DIFFBOT_TOKEN }}
          QUICKEMAILVERIFICATION_API_KEY: ${{ secrets.QUICKEMAILVERIFICATION_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          INBOXTRUE_API_KEY: ${{ secrets.INBOXTRUE_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # one-tap Good/Bad links (Worker URL + signing secret); without them the digest has no buttons
          TELL_LABEL_URL: ${{ vars.TELL_LABEL_URL }}
          LABEL_SECRET: ${{ secrets.LABEL_SECRET }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # public GitHub org commits for email patterns (5000 req/h instead of 60)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opportunity leads (pack opportunities.yaml): events first (federal contracts ending), then the companies that can
      # bid on them (past winners in the same NAICS codes; the incumbent is never its own lead). Telegram + Sheet, no
      # drafts here: "Create draft" writes one on click (drafts.yml). Counts only.
      - name: Opportunity leads
        id: opps
        continue-on-error: true
        timeout-minutes: 50
        run: pnpm opps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # the proof-of-fit check (Haiku) and the rendered site reads (Firecrawl): without them news / signal leads stay unproven and drop
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIT_DAILY_CAP_USD: ${{ vars.FIT_DAILY_CAP_USD || '0.06' }}
          FIT_CHECKS_PER_RUN: ${{ vars.FIT_CHECKS_PER_RUN || '50' }}
          # the event fact-check (article read, quotes verified, stage, needs): Haiku, once per event URL
          EVENT_DAILY_CAP_USD: ${{ vars.EVENT_DAILY_CAP_USD || '0.06' }}
          # job posts for a new plant / site (opportunities kind jobs): JSearch, quota shared with sources.jsearch
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          EVENT_CHECKS_PER_RUN: ${{ vars.EVENT_CHECKS_PER_RUN || '80' }}
          # our own email waterfall (verifiers, web search, finders): only sure addresses are written
          QUICKEMAILVERIFICATION_API_KEY: ${{ secrets.QUICKEMAILVERIFICATION_API_KEY }}
          INBOXTRUE_API_KEY: ${{ secrets.INBOXTRUE_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          BRANDFETCH_SEARCH_API: ${{ secrets.BRANDFETCH_SEARCH_API }}
          BRANDFETCH_BRAND_API: ${{ secrets.BRANDFETCH_BRAND_API }}
          DIFFBOT_TOKEN: ${{ secrets.DIFFBOT_TOKEN }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TELL_LABEL_URL: ${{ vars.TELL_LABEL_URL }}
          LABEL_SECRET: ${{ secrets.LABEL_SECRET }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create-draft clicks left over (the Worker dispatches drafts.yml at once; this catches any it missed)
      - name: Create-draft clicks
        continue-on-error: true
        run: pnpm drafts:requests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_DAILY_CAP_USD: ${{ vars.WRITER_DAILY_CAP_USD || '0.08' }}
          ANALYST_EFFORT: ${{ vars.ANALYST_EFFORT || 'low' }}
          TELL_LABEL_URL: ${{ vars.TELL_LABEL_URL }}
          LABEL_SECRET: ${{ secrets.LABEL_SECRET }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      # catch-up for touch-backs (the digest lists them and drafts up to 8): drafts the rest within the writer cap,
      # only from a NEW fact (Sheet "Follow-up"). Counts only.
      - name: Follow-ups
        if: vars.LEGACY_LEADS == 'on'
        continue-on-error: true
        run: pnpm followups
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_DAILY_CAP_USD: ${{ vars.WRITER_DAILY_CAP_USD || '0.08' }}
          ANALYST_EFFORT: ${{ vars.ANALYST_EFFORT || 'low' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      # Dead-man's switch: healthchecks.io emails you if this ping doesn't arrive on time.
      # Success only when the opportunity-leads step itself succeeded (other steps are continue-on-error).
      - name: Dead-man's switch ping
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_DAILY_URL }}
          OUTCOME: ${{ steps.opps.outcome }}
        run: |
          if [ -z "$HC_URL" ]; then echo "no HEALTHCHECK_DAILY_URL set, skipping"; exit 0; fi
          if [ "$OUTCOME" = "success" ]; then curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null && echo "pinged: ok"
          else curl -fsS -m 10 --retry 3 "$HC_URL/fail" >/dev/null && echo "pinged: fail"; fi

      - name: Upkeep (usage guard, janitor, backup to R2)
        if: always()
        continue-on-error: true
        run: pnpm ops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
