name: Daily chain

# One chain instead of separate crons that must line up (plan v3 section 14 "Daily").
# migrations -> pack check -> partitions -> job-board diff -> gigs -> tick (fallback) -> scoring + digest (once per IST day).
# Starts 07:30 IST so the digest lands before 09:00 even when GitHub delays scheduled runs.
# Public repo: every script prints counts only.
on:
  # Triggered daily at 07:30 IST by the Cloudflare scheduler Worker (infra/scheduler).
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # keep-alive re-enables scheduled workflows

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # private config pack in R2; falls back to packs/example-gtm when TELL_PACK_R2_PREFIX is unset
      TELL_PACK_R2_PREFIX: ${{ vars.TELL_PACK_R2_PREFIX }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Partitions (this month + 2 ahead)
        run: pnpm exec tsx scripts/ensure-partitions.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Config pack
        run: pnpm pack:check

      - name: Job boards diff
        id: boards
        continue-on-error: true # a board outage must not stop scoring/digest; the digest reports it
        run: pnpm boards:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Freelance gigs
        continue-on-error: true
        run: pnpm gigs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Fallback only: runs the tick here if no tick has run in the last 2 hours (scheduler down),
      # so it never overlaps a regular tick and double-spends Haiku.
      - name: Tick (fallback, only if stale)
        continue-on-error: true
        run: pnpm tick --if-stale-minutes 120
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAIKU_DAILY_CAP_USD: ${{ vars.HAIKU_DAILY_CAP_USD || '1' }}

      # Your labels from the Sheet (and any rows a failed append left behind) before today's scoring
      - name: Sheet sync
        continue-on-error: true
        run: pnpm sheet:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      # Hard bounces in the sending mailbox mark those addresses invalid before today's digest (needs gmail.readonly).
      - name: Read bounces
        continue-on-error: true
        run: pnpm bounces
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      - name: Score accounts and send digest
        id: digest
        run: pnpm digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HAIKU_DAILY_CAP_USD: ${{ vars.HAIKU_DAILY_CAP_USD || '1' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # public GitHub org commits for email patterns (5000 req/h instead of 60)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dead-man's switch: healthchecks.io emails you if this ping doesn't arrive on time.
      # Success only when the digest step itself succeeded (other steps are continue-on-error).
      - name: Dead-man's switch ping
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_DAILY_URL }}
          OUTCOME: ${{ steps.digest.outcome }}
        run: |
          if [ -z "$HC_URL" ]; then echo "no HEALTHCHECK_DAILY_URL set, skipping"; exit 0; fi
          if [ "$OUTCOME" = "success" ]; then curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null && echo "pinged: ok"
          else curl -fsS -m 10 --retry 3 "$HC_URL/fail" >/dev/null && echo "pinged: fail"; fi

      - name: Upkeep (usage guard, janitor, backup to R2)
        if: always()
        continue-on-error: true
        run: pnpm ops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling them through the API keeps them alive without commits.
      - name: Keep scheduled workflows alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in tick.yml boards.yml daily.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" >/dev/null && echo "enabled $wf"
          done
