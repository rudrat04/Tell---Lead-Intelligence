name: Tick (30 min)

# Runs watchers -> precision cascade -> Neon every 30 minutes.
# Stand-in for the Trigger.dev schedule while Trigger.dev deployments are blocked for this org.
# The repo is public, so this log is public: scripts/tick.ts prints counts only.
on:
  # Primary trigger: the Cloudflare scheduler Worker (infra/scheduler) dispatches this every 30 min.
  # GitHub's own cron stays as a backup.
  schedule:
    - cron: "7,37 * * * *" # off the :00/:30 rush, when GitHub delays scheduled runs most
  workflow_dispatch:
    inputs:
      max_per_source:
        description: "Max new items per source sent through the cascade"
        required: false

concurrency:
  group: tick
  cancel-in-progress: false # never run two ticks at once; queue instead

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # private config pack in R2; falls back to packs/example-gtm when TELL_PACK_R2_PREFIX is unset
      TELL_PACK_R2_PREFIX: ${{ vars.TELL_PACK_R2_PREFIX }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run tick
        run: pnpm tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAIKU_DAILY_CAP_USD: ${{ vars.HAIKU_DAILY_CAP_USD || '1' }}
          TICK_MAX_PER_SOURCE: ${{ inputs.max_per_source }}

      # Optional dead-man's switch for the 30-minute tick (add the secret once the external scheduler is live)
      - name: Dead-man's switch ping
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_TICK_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$HC_URL" ]; then exit 0; fi
          if [ "$OUTCOME" = "success" ]; then curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null; else curl -fsS -m 10 --retry 3 "$HC_URL/fail" >/dev/null; fi
