name: Create draft (on click)

# Dispatched by the Cloudflare Worker (infra/scheduler) right after you tap "Create draft" on Telegram or the Sheet link.
# Writes one checked opening email per click into the Sheet's "Email draft" column and sends it to Telegram.
# Drafts are written only on a click, so no model tokens go to leads you never write to.
# Public repo: the script prints counts only.
on:
  workflow_dispatch:

concurrency:
  group: drafts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Answer create-draft clicks
        run: pnpm drafts:requests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELL_PACK_R2_PREFIX: ${{ vars.TELL_PACK_R2_PREFIX }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELL_LABEL_URL: ${{ vars.TELL_LABEL_URL }}
          LABEL_SECRET: ${{ secrets.LABEL_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_DAILY_CAP_USD: ${{ vars.WRITER_DAILY_CAP_USD || '0.08' }}
          ANALYST_EFFORT: ${{ vars.ANALYST_EFFORT || 'low' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
