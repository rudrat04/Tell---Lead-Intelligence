name: Weekly discovery + account watch

# Weekly: YC companies -> ICP hard filters -> accounts + job boards.
# The daily board diff runs inside daily.yml. Public repo: the script prints counts only.
on:
  # Triggered Sundays 03:45 IST by the Cloudflare scheduler Worker (infra/scheduler).
  workflow_dispatch:

concurrency:
  group: boards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # private config pack in R2; falls back to packs/example-gtm when TELL_PACK_R2_PREFIX is unset
      TELL_PACK_R2_PREFIX: ${{ vars.TELL_PACK_R2_PREFIX }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm boards:discover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Weekly non-hiring signals: funding/launches (YC pages), website changes, GTM tools (site + DNS).
  watch:
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELL_PACK_R2_PREFIX: ${{ vars.TELL_PACK_R2_PREFIX }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm watch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # SEC asks for a contact email in the User-Agent (Form D); unset = skipped. Cert Spotter key optional.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}
      # Weekly: people search for the best eligible accounts, so the daily digest can name a contact for more of them
      - name: Contact backfill
        if: always()
        continue-on-error: true
        run: pnpm contacts:backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      # Weekly self-tuning proposals from your labels (never applied automatically; counts only in this log)
      - name: Tuning proposals
        if: always()
        continue-on-error: true
        run: pnpm tune
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
