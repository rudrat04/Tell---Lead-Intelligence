name: Job boards discovery

# Weekly: YC companies -> ICP hard filters -> accounts + job boards.
# The daily board diff runs inside daily.yml. Public repo: the script prints counts only.
on:
  schedule:
    - cron: "15 22 * * 6" # Sundays 03:45 IST
  workflow_dispatch:

concurrency:
  group: boards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm boards:discover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
