name: Job boards discovery

# Weekly: YC companies -> ICP hard filters -> accounts + job boards.
# The daily board diff runs inside daily.yml. Public repo: the script prints counts only.
on:
  schedule:
    - cron: "15 22 * * 6" # Sundays 03:45 IST
  workflow_dispatch:

concurrency:
  group: boards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # private config pack in R2; falls back to packs/example-gtm when TELL_PACK_R2_PREFIX is unset
      TELL_PACK_R2_PREFIX: ${{ vars.TELL_PACK_R2_PREFIX }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm boards:discover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
