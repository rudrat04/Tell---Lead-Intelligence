name: Find email (on click)

# Dispatched by the Cloudflare Worker (infra/scheduler) right after you click "Find email" in the digest or the Sheet.
# Runs each queued person through Tell's own email waterfall (finders first, verifiers only for unsure addresses) and
# writes only a verified address into the Sheet (the lead's people, or the people on the signal's side).
# Public repo: the script prints counts only.
on:
  workflow_dispatch:

concurrency:
  group: enrich
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Answer find-email clicks
        run: pnpm enrich:requests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELL_PACK_R2_PREFIX: ${{ vars.TELL_PACK_R2_PREFIX }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELL_LABEL_URL: ${{ vars.TELL_LABEL_URL }}
          LABEL_SECRET: ${{ secrets.LABEL_SECRET }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          # our own email waterfall (verifiers, web search, finders): only sure addresses are written
          QUICKEMAILVERIFICATION_API_KEY: ${{ secrets.QUICKEMAILVERIFICATION_API_KEY }}
          INBOXTRUE_API_KEY: ${{ secrets.INBOXTRUE_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # signal-side contacts: the company's website (Brandfetch, free) and the answer on Telegram
          BRANDFETCH_SEARCH_API: ${{ secrets.BRANDFETCH_SEARCH_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
