# A play = a combination of signals that explains why someone needs you now, with the opening angle.
plays:
  struggling_to_hire:
    title: Struggling to hire ops
    requires: [core_role_open_45d]
    window_days: 60
    angle: "Freelance bridge while they keep hiring: get the GTM system running now, hand it over when the hire lands."
  explicit_ask:
    title: Explicit ask
    requires: [explicit_hire_request]
    window_days: 14
    angle: "Direct reply to their request with a concrete first step."
  contract_role:
    title: Contract GTM role
    requires: [contract_role]
    window_days: 30
    angle: "They already want a contractor: apply with a short scoped proposal."
  first_gtm_hire:
    title: First GTM hire
    requires: [first_role]
    window_days: 45
    angle: "Build the CRM, routing and outbound system before their first GTM hire starts."
  gtm_from_zero:
    title: GTM from zero
    requires: [funding_raise, first_role]
    window_days: 60
    angle: "Fresh funding plus a first GTM hire: build the system before the hire starts."
  stack_chaos:
    title: Tool sprawl, no owner
    requires: [stack_sprawl]
    absent: [core_role_open, core_role_open_45d]
    window_days: 120
    angle: "Several GTM tools and nobody to run them: offer an audit and consolidation."
  sales_led_shift:
    title: Switching to sales-led
    requires: [cta_sales_led]
    window_days: 60
    angle: "Their site moved to 'Book a demo': set up CRM, routing and follow-up for the new motion."
  attention_no_capture:
    title: Attention with nowhere to land
    requires: [stack_sprawl]
    requires_any: [content_motion, product_launch, funding_raise]
    window_days: 60
    angle: "New attention (a launch, a raise, new content) on top of a messy stack: offer to make sure every interested visitor is captured and followed up."
  freeze_to_contract:
    title: Couldn't hire, now open to outside help
    requires: [freeze_to_contract]
    absent: [core_role_filled]
    window_days: 45
    qualifies: true
    angle: "They removed a long-open ops role unfilled and now want contract help: offer to start on the most urgent piece this month."
  outbound_unprotected:
    title: Outbound landing in spam
    requires: [email_auth_gap]
    window_days: 60
    qualifies: true
    angle: "They send cold email without the authentication Gmail and Yahoo require: offer a quick deliverability fix as the first step."
  attribution_blind:
    title: Can't see which channel works
    requires: [attribution_gap]
    requires_any: [funding_raise, product_launch, content_motion]
    window_days: 60
    qualifies: true
    angle: "Investing in growth with a demo form that never asks how people found them: offer to capture the source on every lead."
  slow_site:
    title: Slow site losing visitors
    requires: [site_health_poor]
    requires_any: [cta_sales_led, product_launch, funding_raise, content_motion]
    window_days: 60
    qualifies: true
    angle: "Slow on mobile while pushing for attention: offer a faster site starting with the demo pages."
  champion_moved:
    title: Past client in a new role
    requires: [champion_moved]
    window_days: 90
    qualifies: true
    angle: "Someone you've worked with just started here: congratulate them and offer help in their first 90 days."
