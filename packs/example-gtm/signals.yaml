# Likelihood ratios and half-lives are starting guesses; the weekly refit replaces them once labels exist.
base_rate: 0.02
min_post_strength: 3
signals:
  # posts
  explicit_hire_request: { class: explicit, lr: 12, half_life_days: 14, strength: 5, fast_lane: true }
  pain_post:             { class: pain,     lr: 3,  half_life_days: 21, strength: 3 }
  # job boards ("core" = the role you substitute for; "adjacent" = the need is forming)
  contract_role:         { class: explicit, lr: 10, half_life_days: 21, strength: 5, fast_lane: true }
  first_role:            { class: implicit, lr: 6,  half_life_days: 30, strength: 4, max_events: 1 }
  core_role_open:        { class: implicit, lr: 4,  half_life_days: 30, strength: 4 }
  core_role_open_45d:    { class: implicit, lr: 5,  half_life_days: 30, strength: 4 }
  adjacent_role_open:    { class: implicit, lr: 2,  half_life_days: 30, strength: 3 }
  core_role_filled:      { class: negative, lr: 0.2, half_life_days: 90, strength: 3 }
  # not emitted yet (future sources)
  lookalike_domain_owned: { class: implicit, lr: 4, half_life_days: 45 }
  ops_team_2plus:        { class: negative, lr: 0.15, half_life_days: 180 }
  # company pages, website and DNS watch
  funding_raise:         { class: trigger,  lr: 2.5, half_life_days: 60, strength: 3 }
  product_launch:        { class: trigger,  lr: 2,   half_life_days: 45, strength: 3 }
  cta_sales_led:         { class: trigger,  lr: 2.5, half_life_days: 45, strength: 3 }
  pricing_page_added:    { class: trigger,  lr: 1.8, half_life_days: 45, strength: 3 }
  gtm_tool_added:        { class: implicit, lr: 2.5, half_life_days: 45, strength: 3 }
  stack_sprawl:          { class: implicit, lr: 2.5, half_life_days: 90, strength: 3, max_events: 1 }
gate1:
  # a post must mention at least one of these to reach the LLM (free filter)
  required_any:
    - "(?i)\\b(crm|hubspot|salesforce|pipedrive|attio)\\b"
    - "(?i)\\b(outbound|cold[- ]email|lead[- ]gen(eration)?|deliverability|enrichment|lead routing)\\b"
    - "(?i)\\b(rev ?ops|revenue operations|sales ops|marketing ops|marketing automation|demand gen)\\b"
    - "(?i)\\b(gtm|go[- ]to[- ]market)\\b"
    - "(?i)\\b(apollo\\.io|clay\\.com|clay table|instantly\\.ai|smartlead|lemlist|zapier|make\\.com|n8n)\\b"
    - "(?i)\\b(sdr|bdr|account executive|sales engineer)\\b"
  never:
    - "(?i)we are a (recruiting|staffing) (agency|firm)"
    - "(?i)looking for (a )?job"
    - "(?i)available for hire"
    # HN "Seeking freelancer" threads are mostly freelancers advertising themselves (competitors)
    - "(?im)^\\s*SEEKING WORK"
# Gate 2: similarity of new posts to good/bad examples. Shadow = logged only, nothing dropped.
# Seeds are synthetic; your labelled posts are added weekly. Switch to `enforce` once there are min_exemplars each side.
gate2:
  mode: shadow
  min_exemplars: 20
  seeds:
    pos:
      - "Looking for a freelancer to set up HubSpot properly: lead routing, lifecycle stages and a clean pipeline for our two SDRs."
      - "Our leads go cold because nobody follows up. Need someone to automate follow-ups and connect our forms to the CRM."
      - "Seed-stage B2B SaaS, founder-led sales so far. Want help building our first outbound system before we hire an AE."
      - "We use Apollo, HubSpot and Calendly and none of it talks to each other. Who can untangle this for us?"
      - "Hiring a contract RevOps person for 3 months to clean our Salesforce and build reporting."
      - "Can anyone recommend a GTM engineer? We need enrichment, scoring and routing set up for inbound leads."
    neg:
      - "I'm a freelance HubSpot consultant available for new projects. DM me for my rates."
      - "We are a lead generation agency offering appointment setting for B2B companies."
      - "Looking for a full-time job as a sales development representative, open to relocation."
      - "Check out our new AI SDR tool that books meetings on autopilot. Free trial this week."
      - "Our staffing firm is hiring account executives for one of our clients in fintech."
      - "Hot take: CRMs are dead and every startup should just use spreadsheets."
