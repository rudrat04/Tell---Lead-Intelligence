# Likelihood ratios and half-lives are starting guesses; the weekly refit replaces them once labels exist.
base_rate: 0.02
min_post_strength: 3
signals:
  # posts
  explicit_hire_request: { class: explicit, lr: 12, half_life_days: 14, strength: 5, fast_lane: true }
  pain_post:             { class: pain,     lr: 3,  half_life_days: 21, strength: 3 }
  # job boards ("core" = the role you substitute for; "adjacent" = the need is forming)
  contract_role:         { class: explicit, lr: 10, half_life_days: 21, strength: 5, fast_lane: true }
  first_role:            { class: implicit, lr: 6,  half_life_days: 30, strength: 4, max_events: 1 }
  core_role_open:        { class: implicit, lr: 4,  half_life_days: 30, strength: 4 }
  core_role_open_45d:    { class: implicit, lr: 5,  half_life_days: 30, strength: 4 }
  adjacent_role_open:    { class: implicit, lr: 2,  half_life_days: 30, strength: 3 }
  core_role_filled:      { class: negative, lr: 0.2, half_life_days: 90, strength: 3 }
  # not emitted yet (future sources)
  new_gtm_tool:          { class: implicit, lr: 2.5, half_life_days: 45 }
  lookalike_domain_owned: { class: implicit, lr: 4, half_life_days: 45 }
  funding_raise:         { class: trigger,  lr: 2,  half_life_days: 60 }
  cta_book_demo:         { class: trigger,  lr: 2.5, half_life_days: 45 }
  ops_team_2plus:        { class: negative, lr: 0.15, half_life_days: 180 }
gate1:
  # a post must mention at least one of these to reach the LLM (free filter)
  required_any:
    - "(?i)\\b(crm|hubspot|salesforce|pipedrive|attio)\\b"
    - "(?i)\\b(outbound|cold[- ]email|lead[- ]gen(eration)?|deliverability|enrichment|lead routing)\\b"
    - "(?i)\\b(rev ?ops|revenue operations|sales ops|marketing ops|marketing automation|demand gen)\\b"
    - "(?i)\\b(gtm|go[- ]to[- ]market)\\b"
    - "(?i)\\b(apollo\\.io|clay\\.com|clay table|instantly\\.ai|smartlead|lemlist|zapier|make\\.com|n8n)\\b"
    - "(?i)\\b(sdr|bdr|account executive|sales engineer)\\b"
  never:
    - "(?i)we are a (recruiting|staffing) (agency|firm)"
    - "(?i)looking for (a )?job"
    - "(?i)available for hire"
    # HN "Seeking freelancer" threads are mostly freelancers advertising themselves (competitors)
    - "(?im)^\\s*SEEKING WORK"
