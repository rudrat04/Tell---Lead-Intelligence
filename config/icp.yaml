# Machine-readable ICP hard filters (business decisions; never changed by self-tuning).
# The prose ICP is in icp.md.
version: 1
hard_filters:
  team_size: { min: 2, max: 150 }
  # YC dataset: keep these industries (B2B software); drop the rest
  industries_any: ["B2B"]
  # company statuses to keep
  statuses: ["Active"]
  exclude_domains: []   # competitors, existing clients, etc.
size_bands:
  - { band: "2-10", max: 10 }
  - { band: "11-50", max: 50 }
  - { band: "51-150", max: 150 }
